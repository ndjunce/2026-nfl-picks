<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phipps Tavern Speciality Picks 2026</title>
<style>
  :root{--bg:#0b0f16;--card:#161d2a;--card2:#1d2636;--ink:#f2f6fb;--mut:#8f9cb0;
        --line:#28313f;--grn:#33e08a;--red:#ff6060;--yel:#ffd23f;--blu:#4aa8ff;--gold:#ffcf3f;}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{padding:16px;text-align:center;background:linear-gradient(180deg,#121a26,#0c1119);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
  .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 12px;font-weight:800}

  /* player avatar (photo or initials fallback) — bigger so faces are visible */
  .avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#0d131c;
          border:1px solid var(--line);flex:0 0 52px;display:inline-block;vertical-align:middle}
  .avatar-fb{width:52px;height:52px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
             flex:0 0 52px;display:inline-flex;align-items:center;justify-content:center;
             font-size:19px;font-weight:800;color:var(--blu);vertical-align:middle}
  /* team logo (image or abbr fallback) */
  .logo{width:26px;height:26px;object-fit:contain;vertical-align:middle}
  .logo-fb{font-weight:800;vertical-align:middle}
  .teamchip{display:inline-flex;align-items:center;gap:5px}

  /* leaderboard */
  .lb{display:flex;flex-direction:column;gap:8px}
  .lbrow{display:grid;grid-template-columns:26px 52px 1fr auto auto;gap:12px;align-items:center;
         padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:11px}
  .lbrow.lead{border-color:var(--gold);background:rgba(255,207,63,.07)}
  .lbrow .rk{font-weight:800;color:var(--mut);text-align:center}
  .lbrow .nm{font-weight:800;font-size:16px}
  .lbrow .nm .crown{color:var(--gold)}
  .lbrow .rec{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
  .lbrow .w{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  .tiebreak{color:var(--mut);font-size:11.5px;margin-top:10px;line-height:1.5}
  .tiebreak b{color:var(--ink)}

  /* games */
  .games{display:flex;flex-direction:column;gap:12px}
  .game{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
  .ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .matchup{font-weight:800;font-size:15px}
  .matchup .won{color:var(--grn)}
  .matchup .lost{color:var(--mut)}
  .gstatus{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .s-pre{background:#0d131c;color:var(--mut);border:1px solid var(--line)}
  .s-in{background:rgba(255,96,96,.16);color:var(--red)}
  .s-post{background:rgba(51,224,138,.16);color:var(--grn)}
  .score{color:var(--mut);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .picks{display:flex;flex-wrap:wrap;gap:6px}
  .pk{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:#0d131c;border:1px solid var(--line)}
  .pk .who{color:var(--mut)}
  .pk.correct{background:rgba(51,224,138,.14);border-color:rgba(51,224,138,.5)}
  .pk.wrong{background:rgba(255,96,96,.12);border-color:rgba(255,96,96,.45);opacity:.8}
  .pk.correct .pick{color:var(--grn)} .pk.wrong .pick{color:var(--red)}

  .refresh{text-align:center;color:var(--mut);font-size:11.5px;margin:4px 0 18px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-right:5px;vertical-align:middle}
  .dot.idle{background:var(--mut)}
  .err{background:rgba(255,96,96,.12);border:1px solid var(--red);color:var(--ink);padding:12px;border-radius:10px;font-size:13px}
  .note{color:var(--mut);font-size:11px;text-align:center;margin-top:8px}
  .muted{color:var(--mut)}
  /* nav tabs (shared across pages) */
  .tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .tabs a{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;
          font-size:13.5px;font-weight:800;text-decoration:none;color:var(--mut);
          background:#0d131c;border:1px solid var(--line);transition:.12s}
  .tabs a:hover{color:var(--ink);border-color:var(--blu)}
  .tabs a.active{color:#04121f;background:var(--blu);border-color:var(--blu)}
  .tabs a.soon{opacity:.5;pointer-events:none}
  /* week selector tabs (Week 1..18) */
  .weekbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .weekbar .wk{min-width:40px;text-align:center;padding:7px 10px;border-radius:9px;font-size:12.5px;
       font-weight:800;cursor:pointer;background:#0d131c;border:1px solid var(--line);color:var(--mut);transition:.12s}
  .weekbar .wk:hover{color:var(--ink);border-color:var(--blu)}
  .weekbar .wk.active{background:var(--blu);border-color:var(--blu);color:#04121f}
  .weekbar .wk.has{color:var(--ink)}
  .weekbar .wk.empty{opacity:.4;cursor:default}
  .weekbar .wk.live{border-color:var(--grn)}
  .weekbar .wk .dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grn);margin-left:4px;vertical-align:middle}
  .weeklbl{font-size:11px;color:var(--mut);text-align:center;margin-bottom:12px}

  /* deciding games */
  .dg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;
      background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .dg.split{border-color:var(--yel)}
  .dg.consensus{opacity:.6}
  .dg .mu{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
  .dg .tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .dg .tag.split{background:rgba(255,210,63,.16);color:var(--yel);border:1px solid var(--yel)}
  .dg .tag.consensus{background:#0d131c;color:var(--mut);border:1px solid var(--line)}
  .dg .split-detail{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}

  /* ---- PATH TO WIN ---- */
  .ptw-banner{font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
  .ptw-banner.win{background:rgba(255,207,63,.1);border-color:var(--gold);font-weight:800;font-size:15px}
  .ptw-list{display:flex;flex-direction:column;gap:8px}
  .ptw-row{display:grid;grid-template-columns:22px 44px 1fr auto;gap:11px;align-items:center;
    padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:11px}
  .ptw-row.lead{border-color:var(--gold);background:rgba(255,207,63,.06)}
  .ptw-row.clinched{border-color:var(--gold);background:rgba(255,207,63,.1)}
  .ptw-row.elim{opacity:.5}
  .ptw-row .avatar,.ptw-row .avatar-fb{width:44px;height:44px;flex-basis:44px;font-size:16px}
  .ptw-rk{font-weight:800;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
  .ptw-mid{display:flex;flex-direction:column;gap:2px;min-width:0}
  .ptw-name{font-weight:800;font-size:16px}
  .ptw-need{font-size:12px;color:var(--mut);line-height:1.35}
  .ptw-need.clinch{color:var(--gold);font-weight:700}
  .ptw-need.elim{color:var(--red);opacity:.85}
  .ptw-pct{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blu);
    min-width:56px;text-align:right}
  .ptw-pct.win{color:var(--gold)}
  .ptw-swing-h{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;
    letter-spacing:.05em;margin:16px 0 8px}
  .ptw-swing{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;
    background:var(--bg);border:1px solid var(--yel);border-radius:10px;margin-bottom:8px}
  .ptw-swing .mu{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
  .ptw-swing-p{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}

  /* ---- GAME-FIRST rooting view ---- */
  .ptw-legend{font-size:11.5px;color:var(--mut);margin-bottom:12px}
  .ptwg-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .ptwg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .ptwg.decisive{border-color:var(--yel)}
  .ptwg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .ptwg-mu{font-weight:800;font-size:15px}
  .ptwg-kick{font-size:11px;color:var(--mut);font-weight:700}
  .ptwg-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
  .rvs{align-self:center;color:var(--mut);font-size:11px;font-weight:800}
  .rside{min-width:0}
  .rside-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;margin-bottom:6px}
  .rside-team{font-variant-numeric:tabular-nums}
  .rside-p{margin-left:auto;font-size:12px;color:var(--mut);font-weight:800;font-variant-numeric:tabular-nums}
  .rside-rooters{display:flex;flex-wrap:wrap;gap:5px}
  .rooter{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;
    background:#0d131c;border:1px solid var(--line);color:var(--ink)}
  .rooter.must{background:rgba(255,96,96,.16);border-color:var(--red);color:var(--red)}
  .rooter.big{background:rgba(255,210,63,.14);border-color:var(--yel);color:var(--yel)}
  .rooter.minor{color:var(--mut)}
  .rooter.dead{opacity:.45;text-decoration:line-through}
  .ptw-sub-h{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;
    letter-spacing:.05em;margin:6px 0 10px}
  /* needed-games narrative (main content) */
  .ptw-need{font-size:13px;line-height:1.6;color:var(--ink);display:block;white-space:normal}
  .pn-need-g{display:inline-flex;align-items:center;gap:3px;background:#0d131c;border:1px solid var(--line);
    border-radius:8px;padding:2px 7px;margin:2px 2px 2px 0;font-weight:700;font-size:12.5px;white-space:nowrap}
  .pn-need-g .logo{width:18px;height:18px}
  .pn-clinch{color:var(--gold)} .pn-elim{color:var(--red)}
  .ptw-pct{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
  .ptw-pct-lbl{font-size:8px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  /* "games that matter to me" mini-list — the pivotal 2-3, personal per player */
  .mm{margin-top:8px;padding:8px 10px;background:rgba(74,168,255,.06);border:1px solid var(--line);
    border-left:3px solid var(--blu);border-radius:8px}
  .mm-h{font-size:11px;font-weight:800;color:var(--blu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .mm-row{display:flex;align-items:baseline;gap:7px;font-size:12.5px;line-height:1.5;padding:2px 0}
  .mm-ic{width:16px;flex:0 0 16px;text-align:center}
  .mm-g{font-weight:700;white-space:nowrap}
  .mm-g .logo{width:16px;height:16px}
  .mm-why{color:var(--mut);font-size:11.5px}
  .mm-sw{color:var(--blu);font-weight:700;font-variant-numeric:tabular-nums}
  /* let the per-player row grow to fit the needed-games list */
  .ptw-row{align-items:flex-start}
  .ptw-row .ptw-rk,.ptw-row .avatar,.ptw-row .avatar-fb{margin-top:2px}
  @media (min-width:820px){
    .ptwg-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  }

  /* ---- DESKTOP: use the wider screen; mobile layout above is unchanged ---- */
  @media (min-width:820px){
    .wrap{max-width:1080px;padding:22px}
    h1{font-size:26px}
    .sub{font-size:14px}
    /* leaderboard becomes 2 columns of cards on desktop */
    .lb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .lbrow{padding:14px 16px}
    .avatar,.avatar-fb{width:60px;height:60px;flex-basis:60px}
    .avatar-fb{font-size:22px}
    .lbrow{grid-template-columns:30px 60px 1fr auto auto}
    .lbrow .nm{font-size:18px}
    .lbrow .w{font-size:26px}
    /* games become a responsive multi-column grid */
    .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
    .matchup{font-size:16px}
    .dg{padding:12px 15px}
    .logo{width:30px;height:30px}
  }

  /* ============================================================================
     PHONE (<=640px) — genuine mobile layout. CSS ONLY; desktop (>=820px) unchanged.
     Everything stacks single-column; readable ~15px; no horizontal page scroll.
     ============================================================================ */
  @media (max-width:640px){
    *{box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    body{font-size:15px}
    header{padding:12px 12px}
    h1{font-size:17px;line-height:1.2}
    .sub{font-size:11.5px}
    .wrap{max-width:100%;padding:10px;margin:0}
    .card{padding:12px;margin-bottom:12px;border-radius:12px}
    .card h2{font-size:11.5px}
    .note{font-size:11px}

    /* nav tabs + week bar: wrap, 44px tap targets */
    .tabs a{padding:9px 14px;font-size:13px}
    .weekbar{gap:5px}
    .weekbar .wk{min-width:34px;min-height:38px;padding:6px 8px;font-size:12.5px;
      display:flex;align-items:center;justify-content:center}
    .filters button, .tabs a{min-height:44px}

    /* LEADERBOARD: clean single-column rows, readable name/record/rank */
    .lb{display:flex;flex-direction:column;gap:8px}
    .lbrow{grid-template-columns:22px 40px 1fr auto;gap:10px;padding:10px 11px}
    .avatar,.avatar-fb{width:40px;height:40px;flex-basis:40px}
    .avatar-fb{font-size:15px}
    .lbrow .rk{font-size:13px}
    .lbrow .nm{font-size:15px}
    .lbrow .rec{font-size:12px}
    .lbrow .w{font-size:20px;min-width:28px}

    /* PATH TO WIN rows: single column, avatar smaller, needed-games wrap */
    .ptw-row{grid-template-columns:20px 38px 1fr auto;gap:9px;padding:10px 11px}
    .ptw-row .avatar,.ptw-row .avatar-fb{width:38px;height:38px;flex-basis:38px;font-size:14px}
    .ptw-name{font-size:15px}
    .ptw-need{font-size:12.5px}
    .ptw-pct{font-size:15px}

    /* "GAMES THAT MATTER" mini-list: legible chips + logos, clear separation */
    .mm{padding:9px 10px;margin-top:8px}
    .mm-h{font-size:11px}
    .mm-row{flex-wrap:wrap;font-size:13px;gap:5px;padding:3px 0}
    .mm-g{white-space:normal}
    .mm-g .logo{width:18px;height:18px}
    .mm-why{flex-basis:100%;margin-left:23px;font-size:11.5px}
    .pn-need-g{font-size:12.5px;padding:3px 8px}
    .pn-need-g .logo{width:18px;height:18px}

    /* WHO'S-ROOTING game cards: ONE per row (list already single-col <820px), and stack the
       two team sides VERTICALLY so rooting players aren't squeezed at ~390px. */
    .ptwg-list{display:flex;flex-direction:column;gap:10px}
    .ptwg{padding:11px}
    .ptwg-h{flex-wrap:wrap;gap:6px}
    .ptwg-mu{font-size:15px}
    .ptwg-sides{grid-template-columns:1fr;gap:8px}
    .rvs{display:none}                                   /* the middle "vs" divider — drop when stacked */
    .rside{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:rgba(255,255,255,.02)}
    .rside-h{font-size:13px}
    .rside-rooters{gap:6px}
    .rooter{font-size:12.5px;padding:4px 9px}
    .logo{width:24px;height:24px}
    .tag{font-size:10.5px}

    /* long team-name chips / matchups never force width */
    .teamchip{min-width:0}
  }
</style>
</head>
<body>
<header>
  <h1>🍺 Phipps Tavern Speciality Picks 2026</h1>
  <div class="sub" id="subhead">Loading…</div>
  <nav class="tabs">
    <a href="index.html" class="active">🏈 Picks</a>
    <a href="stats.html">📊 Stats</a>
    <a href="admin.html">✏️ Admin</a>
    <a href="#" class="soon">＋ More</a>
  </nav>
</header>

<div class="wrap">
  <div id="errbox"></div>

  <div class="weekbar" id="weekbar"></div>
  <div class="weeklbl" id="weeklbl"></div>

  <div class="card">
    <h2>🧭 Path to Win <span class="muted" style="font-size:11px;text-transform:none;letter-spacing:0">— who's rooting for what, and who's sweating each game</span></h2>
    <div id="pathtowin"></div>
  </div>

  <div class="card">
    <h2>🏆 Leaderboard</h2>
    <div class="lb" id="leaderboard"></div>
    <div class="tiebreak" id="tiebreak"></div>
  </div>

  <div class="refresh" id="refresh"></div>

  <div class="card">
    <h2>Games &amp; Picks <span class="muted" style="font-size:11px;text-transform:none;letter-spacing:0">— who picked what</span></h2>
    <div class="games" id="games"></div>
  </div>

  <div class="note">Live scores from ESPN's public scoreboard, updated in your browser. Picks are read from <code>picks.js</code>.</div>
</div>

<!-- picks.js = the current (live) week; season.js = archived past weeks (both drive the week tabs) -->
<script src="picks.js"></script>
<script src="season.js"></script>
<script>
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
// Smart adaptive polling: interval depends on whether games are live / today / done.
const POLL_LIVE  = 50000;    // ~50s while any game is IN PROGRESS (catches in->post grading)
const POLL_SOON  = 240000;   // ~4 min when games are today but none live yet / between games
const POLL_IDLE  = 1500000;  // ~25 min when no games today or all games FINAL
let pollTimer = null;

// Normalize a matchup to an unordered key so pick order (team1/team2) doesn't matter.
function mkey(a, b){ return [a.toUpperCase(), b.toUpperCase()].sort().join("|"); }

// ---- team logos ----
// Prefer the feed's authoritative competitor.team.logo (filled by indexGames); fall back to
// ESPN's stable CDN-by-abbreviation pattern so logos still show BEFORE the first fetch returns.
const LOGOS = {};
function logoUrl(abbr){
  const A = String(abbr).toUpperCase();
  return LOGOS[A] || `https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/${A.toLowerCase()}.png`;
}
// <img> logo with the abbreviation kept as a small fallback label if the image fails.
function teamChip(abbr, cls){
  const A = String(abbr||"").toUpperCase();
  if(!A) return `<span class="teamchip"><span class="logo-fb ${cls||''}">—</span></span>`;
  return `<span class="teamchip" title="${A}">`
    + `<img class="logo" src="${logoUrl(A)}" alt="${A}" `
    + `onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">`
    + `<span class="logo-fb ${cls||''}" style="display:none">${A}</span></span>`;
}

// ---- Central Time formatting (convert the feed's UTC kickoff to America/Chicago) ----
function fmtCT(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  try{
    return new Intl.DateTimeFormat("en-US",{ timeZone:"America/Chicago",
      weekday:"short", hour:"numeric", minute:"2-digit" }).format(d) + " CT";
  }catch(e){ return ""; }
}
// The current wall-clock time (America/Chicago) as a "YYYY-MM-DD" string.
function ymdCT(d){
  try{ return new Intl.DateTimeFormat("en-CA",{ timeZone:"America/Chicago",
      year:"numeric", month:"2-digit", day:"2-digit" }).format(d); }
  catch(e){ return d.toISOString().slice(0,10); }
}
function isTodayCT(iso){ const d=new Date(iso); if(isNaN(d)) return false; return ymdCT(d)===ymdCT(new Date()); }
// Adaptive poll summary (set by render) + tier selection.
let pollSummary = { anyLive:false, gamesToday:false, allFinal:false, anyPre:true };
function nextPollMs(){
  if(pollSummary.anyLive) return POLL_LIVE;              // a game is live -> catch in->post fast
  if(pollSummary.allFinal) return POLL_IDLE;             // week done -> back off
  if(pollSummary.gamesToday) return POLL_SOON;           // games today, none live yet -> medium
  return POLL_IDLE;                                       // no games today -> slow
}
function pollLabel(){
  if(pollSummary.anyLive) return "live now · checking ~50s";
  if(pollSummary.allFinal) return "all games final · slow check";
  if(pollSummary.gamesToday) return "games today · checking ~4 min";
  return "no games today · slow check";
}

// ---- player photos (committed under /players/<name>.jpg; falls back to initials circle) ----
function photoUrl(name){ return `players/${String(name).toLowerCase()}.jpg`; }
// Photos may be .jpg OR .png. Try .jpg first; on error retry .png once; then show initials.
function photoImgErr(img){
  if(img.dataset.tried!=="png"){ img.dataset.tried="png"; img.src=img.src.replace(/\.jpg(\?.*)?$/i,".png"); return; }
  img.style.display="none"; if(img.nextElementSibling) img.nextElementSibling.style.display="inline-flex";
}
function avatar(name){
  const initials = String(name||"?").trim().slice(0,1).toUpperCase();
  return `<img class="avatar" src="${photoUrl(name)}" alt="${name}" onerror="photoImgErr(this)">`
    + `<span class="avatar-fb" style="display:none">${initials}</span>`;
}

let lastGood = null;   // last successful ESPN payload (so a failed poll doesn't blank the page)

// ---- week state --------------------------------------------------------------
// The LIVE week = the one in picks.js (fetched from ESPN, graded live, auto-polled).
// PAST weeks = archived in season.js (SEASON.weeks[].games[] carries team1/team2/winner/picks).
// The week tabs let you view any week; only the live week polls ESPN.
const LIVE_WEEK = (window.PICKS && PICKS.week) || 1;
const TOTAL_WEEKS = 18;
let selectedWeek = LIVE_WEEK;

// Archived weeks keyed by week number (from season.js).
const ARCHIVE = {};
if(window.SEASON && Array.isArray(SEASON.weeks)){
  SEASON.weeks.forEach(w=>{ if(w && w.week!=null) ARCHIVE[w.week] = w; });
}
// A week "has data" if it's the live week, or it's archived with game detail.
function weekHasData(n){
  if(n===LIVE_WEEK) return true;
  const a = ARCHIVE[n];
  return !!(a && Array.isArray(a.games) && a.games.length);
}

async function fetchScores(){
  // Query the specific week so results are correct even after the week rolls over.
  const url = `${ESPN}?week=${PICKS.week}&seasontype=2&dates=${PICKS.season}`;
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error("ESPN "+res.status);
  return res.json();
}

// Build a map: matchup key -> {state, completed, winnerAbbr, total, detail, scores}
function indexGames(data){
  const m = {};
  (data.events||[]).forEach(ev=>{
    const c = ev.competitions && ev.competitions[0]; if(!c) return;
    const comp = c.competitors||[];
    const t1 = comp[0], t2 = comp[1]; if(!t1||!t2) return;
    const a1 = t1.team.abbreviation, a2 = t2.team.abbreviation;
    // record the feed's authoritative logo URL per team (competitor.team.logo)
    if(t1.team.logo) LOGOS[a1.toUpperCase()] = t1.team.logo;
    if(t2.team.logo) LOGOS[a2.toUpperCase()] = t2.team.logo;
    const st = c.status && c.status.type ? c.status.type : {};
    let winner = null;
    if(st.completed){ winner = (t1.winner? a1 : (t2.winner? a2 : null)); }
    const s1 = parseInt(t1.score||0,10), s2 = parseInt(t2.score||0,10);
    const state = st.state || "pre";
    // ---- win probability (per team abbr, 0..1) + which source we used (honest labeling) ----
    // Priority: (1) ESPN live win% while in-progress, (2) pregame odds spread -> logistic,
    // (3) in-progress score+time heuristic, (4) 50/50 not-started. probSource is null if none.
    const A = a1.toUpperCase(), B = a2.toUpperCase();
    let winProb = null, probSource = null;
    // (1) ESPN live win probability (only present on some in-progress feeds)
    const espnP = c.situation && c.situation.lastPlay && c.situation.lastPlay.probability;
    if(state === "in" && espnP && espnP.homeWinPercentage != null){
      // homeAway tells us which competitor is home
      const homeAbbr = (t1.homeAway === "home" ? A : B);
      const awayAbbr = (homeAbbr === A ? B : A);
      const hp = Math.max(0, Math.min(1, espnP.homeWinPercentage));
      winProb = { [homeAbbr]: hp, [awayAbbr]: 1 - hp };
      probSource = "espn-live";
    }
    // (2) pregame odds: spread + which side favored (details string carries the fav abbr)
    if(!winProb){
      const od = (c.odds && c.odds[0]) ? c.odds[0] : null;
      const sp = od && (od.spread != null) ? Math.abs(Number(od.spread)) : null;
      let favAbbr = null;
      if(od){
        if(od.homeTeamOdds && od.homeTeamOdds.favorite) favAbbr = (t1.homeAway === "home" ? A : B);
        else if(od.awayTeamOdds && od.awayTeamOdds.favorite) favAbbr = (t1.homeAway === "home" ? B : A);
        else if(od.details){ // e.g. "SEA -3" -> favored team abbr is the token before the number
          const mm = String(od.details).match(/([A-Z]{2,4})\s*-?\d/);
          if(mm && (mm[1]===A || mm[1]===B)) favAbbr = mm[1];
        }
      }
      if(sp != null && favAbbr){
        // NFL spread -> win prob (logistic fit; ~ -3 => 60%, -7 => 71%, -10 => 78%). Cap 50..92%.
        const p = 1 / (1 + Math.exp(-0.14 * sp));
        const pf = Math.max(0.5, Math.min(0.92, p));
        const dogAbbr = favAbbr === A ? B : A;
        winProb = { [favAbbr]: pf, [dogAbbr]: 1 - pf };
        probSource = "odds-spread";
      }
    }
    // (3) in-progress fallback from score margin + time when no prob source above
    if(!winProb && state === "in"){
      const lead = s1 - s2;                          // A minus B
      // crude: each point of lead ~ +3% toward the leader, centered at 50%
      let pA = 0.5 + Math.max(-0.42, Math.min(0.42, lead * 0.03));
      winProb = { [A]: pA, [B]: 1 - pA };
      probSource = "live-score";
    }
    // (4) not-started, no odds -> even
    if(!winProb){
      winProb = { [A]: 0.5, [B]: 0.5 };
      probSource = "even";
    }
    m[mkey(a1,a2)] = {
      state, completed: !!st.completed, detail: st.shortDetail||"",
      date: ev.date || (c && c.date) || null,
      winner, total: s1+s2,
      scores: { [A]: s1, [B]: s2 },
      winProb, probSource
    };
  });
  return m;
}

// ============================================================================
// PATH TO WIN — for each player: current correct count, what they NEED in the
// remaining undecided games, tiebreaker-aware tie resolution, elimination, and a
// labeled likelihood ESTIMATE from per-game win probabilities. Pure/display-only.
//   gamesOut: [{g, info}]  (info carries completed, winner, winProb, probSource)
//   players:  PICKS.players
//   tbPreds:  { player: predictedTotal }   tbActual: number|null (DEN/KC final total)
// Returns { state, players:[{...}], swing:[...], hasProbSource, tbResolved }
// ============================================================================
function computePathToWin(gamesOut, players, tbPreds, tbActual){
  // classify games
  const finals = [], undecided = [];
  gamesOut.forEach(o=>{
    if(o.info && o.info.completed && o.info.winner) finals.push(o);
    else undecided.push(o);
  });

  // current correct (from finals only)
  const correct = {}; players.forEach(p=>correct[p]=0);
  finals.forEach(({g,info})=>{
    const w = info.winner.toUpperCase();
    players.forEach(p=>{ if((g.picks[p]||"").toUpperCase()===w) correct[p]++; });
  });

  // remaining games each player has a LIVE pick in (their picked team still undecided)
  const liveUndecided = undecided.filter(o=>{
    // a game "counts" for a player only if they picked one of the two teams
    return players.some(p=>{ const pk=(o.g.picks[p]||"").toUpperCase(); return pk===o.g.team1.toUpperCase()||pk===o.g.team2.toUpperCase(); });
  });
  const remainingFor = {}; players.forEach(p=>{
    remainingFor[p] = undecided.filter(o=>{ const pk=(o.g.picks[p]||"").toUpperCase(); return pk===o.g.team1.toUpperCase()||pk===o.g.team2.toUpperCase(); }).length;
  });
  const maxPossible = {}; players.forEach(p=> maxPossible[p]=correct[p]+remainingFor[p]);

  // tiebreaker rank helper: among a set of tied-on-wins players, lower |pred-actual| wins.
  // If tbActual is null (that game not final), ties are UNRESOLVED (return null winner).
  function tbWinner(names){
    if(names.length===1) return names[0];
    if(tbActual==null) return null;                 // can't resolve yet
    let best=null, bestDiff=Infinity;
    names.forEach(n=>{ const pred=tbPreds&&tbPreds[n]!=null?tbPreds[n]:null;
      const d = pred!=null?Math.abs(pred-tbActual):Infinity;
      if(d<bestDiff){ bestDiff=d; best=n; } });
    return best;
  }

  // ---- likelihood via exact enumeration over undecided games (2^k) when feasible ----
  // Each undecided game contributes a probability that a given side wins; we enumerate
  // all outcome combinations, weight by product of chosen-side probs, and tally who wins.
  const k = undecided.length;
  const anyProb = undecided.some(o=>o.info && o.info.probSource && o.info.probSource!=="even")
    || finals.length>0;   // if games are final we can still show NEEDS; prob source flagged below
  const hasProbSource = undecided.some(o=>o.info && o.info.probSource && o.info.probSource!=="even");

  const winShare = {}; players.forEach(p=>winShare[p]=0);
  // conditional win-share: for each undecided game i and player p, credit summed over scenarios
  // where side A won (condA) vs side B won (condB). Lets us measure how much each game swings
  // each rooting player's title chance -> the 🔥/⚠️/· intensity tags. probMassA[i] = P(side A wins).
  let sides = [];
  const condA = [], condB = [], probMassA = [];
  let enumerated = false;
  if(k>0 && k<=18){
    enumerated = true;
    // precompute per-undecided-game: [teamAbbrWinner, probThatWinner] for each of 2 sides
    sides = undecided.map(o=>{
      const A=o.g.team1.toUpperCase(), B=o.g.team2.toUpperCase();
      const wp = (o.info && o.info.winProb) ? o.info.winProb : {[A]:0.5,[B]:0.5};
      return { A, B, pA: (wp[A]!=null?wp[A]:0.5) };
    });
    for(let i=0;i<k;i++){ condA[i]={}; condB[i]={}; probMassA[i]=0; players.forEach(p=>{condA[i][p]=0;condB[i][p]=0;}); }
    // exact needed-games tracking (count scenarios, prob-independent, so ties/needs are certain):
    //   winCnt[p]                = # of outcome-combos where p wins the week
    //   winWhenPickHit[i][p]     = # of p's winning combos where p's pick in game i WON
    //   winWhenPickMiss[i][p]    = # of p's winning combos where p's pick in game i LOST (or p had no pick)
    // If winCnt>0 and winWhenPickMiss[i][p]===0 (and p picked game i) => game i is REQUIRED for p.
    const winCnt = {}; players.forEach(p=>winCnt[p]=0);
    const winPickHit = [], winPickMiss = [];
    for(let i=0;i<k;i++){ winPickHit[i]={}; winPickMiss[i]={}; players.forEach(p=>{winPickHit[i][p]=0;winPickMiss[i][p]=0;}); }
    const total = 1<<k;
    for(let mask=0; mask<total; mask++){
      let prob = 1;
      const wins = {}; players.forEach(p=>wins[p]=correct[p]);
      const aWon = [];
      // track, per player, whether each of their picked undecided games hit this scenario
      const pickHit = players.map(()=>[]); // index by player order
      for(let i=0;i<k;i++){
        const winnerIsA = !!(mask & (1<<i));
        aWon[i] = winnerIsA;
        const s = sides[i];
        prob *= winnerIsA ? s.pA : (1-s.pA);
        const w = winnerIsA ? s.A : s.B;
        players.forEach((p,pi)=>{
          const pk=(undecided[i].g.picks[p]||"").toUpperCase();
          if(pk===s.A||pk===s.B){ const hit = (pk===w); if(hit) wins[p]++; pickHit[pi][i]=hit?1:0; }
          else pickHit[pi][i]=-1; // no pick in this game
        });
      }
      // who wins this scenario? highest wins, tie-break by TB (if resolvable)
      let top=-1; players.forEach(p=>{ if(wins[p]>top) top=wins[p]; });
      const tied = players.filter(p=>wins[p]===top);
      const champ = tbWinner(tied);
      // credit this scenario to the champ(s)
      const credit = {};
      if(champ){ credit[champ] = prob; }
      else { tied.forEach(t=> credit[t] = (credit[t]||0) + prob/tied.length); }
      players.forEach(p=>{ winShare[p] += (credit[p]||0); });
      // exact win-scenario counting (a player "wins" a combo if sole champ, OR co-champ with TB unresolved)
      const soleWinners = champ ? [champ] : tied;   // if TB resolvable, single champ; else all tied count as possible
      soleWinners.forEach(p=>{
        winCnt[p]++;
        const pi = players.indexOf(p);
        for(let i=0;i<k;i++){ const h=pickHit[pi][i]; if(h===1) winPickHit[i][p]++; else if(h===0) winPickMiss[i][p]++; }
      });
      // accumulate per-game conditional credit + side-A probability mass
      for(let i=0;i<k;i++){
        if(aWon[i]) probMassA[i] += prob;
        const bucket = aWon[i] ? condA[i] : condB[i];
        players.forEach(p=>{ if(credit[p]) bucket[p] += credit[p]; });
      }
    }
    // expose for needed-games derivation
    computePathToWin._winCnt = winCnt;
    computePathToWin._winPickHit = winPickHit;
    computePathToWin._winPickMiss = winPickMiss;
  }

  // ---- per-player NEEDS text + clinch/eliminated flags ----
  // Determine the current leader-on-the-board (by correct now, TB-aware) for "can't catch" msgs.
  const curTop = Math.max(0, ...players.map(p=>correct[p]));
  // A player is ELIMINATED if even winning all their remaining live games can't reach the
  // best-case of the field leader's floor. Precise check: max X <  (someone else's guaranteed
  // min that also beats X on TB). Simpler robust rule: eliminated if maxPossible[X] < the
  // highest *current* correct among players whose remaining can only add (i.e. can't be caught).
  // We use: eliminated if maxPossible[X] < curTop AND (maxPossible[X] < curTop) — i.e. can't
  // even tie the current top count. (Conservative; a player who can only tie stays "alive-tie".)
  const WC = computePathToWin._winCnt || {};
  const WHIT = computePathToWin._winPickHit || [];
  const WMISS = computePathToWin._winPickMiss || [];
  const results = players.map(p=>{
    const cur = correct[p], rem = remainingFor[p], mx = maxPossible[p];
    // opponents' best case to gauge whether winning-out is enough
    const oppMax = Math.max(0, ...players.filter(q=>q!==p).map(q=>maxPossible[q]));
    const oppCurTop = Math.max(0, ...players.filter(q=>q!==p).map(q=>correct[q]));
    const eliminated = mx < oppCurTop;               // can't even reach a rival's locked-in count
    const clinched = cur > oppMax;                   // already more than anyone else can reach

    // ---- SPECIFIC NEEDED GAMES/OUTCOMES (the main content) ----
    // For each undecided game p has a pick in, does p have ANY winning combo where that pick MISSED?
    //   no  -> that game is REQUIRED (p must have their team win it).
    //   yes -> helpful but not strictly required.
    // A player who wins in EVERY combo where at least one of their picks hits, but never when all
    // miss, gets an "either of" clinch note. We surface: required[], helpful[], and a clinch hint.
    const myGames = [];
    if(enumerated && !eliminated){
      for(let i=0;i<undecided.length;i++){
        const o = undecided[i];
        const A=o.g.team1.toUpperCase(), B=o.g.team2.toUpperCase();
        const pk=(o.g.picks[p]||"").toUpperCase();
        if(pk!==A && pk!==B) continue;               // no pick in this game
        const missWins = WMISS[i] ? (WMISS[i][p]||0) : 0;   // winning combos where this pick LOST
        const hitWins  = WHIT[i] ? (WHIT[i][p]||0) : 0;     // winning combos where this pick WON
        const required = (WC[p]>0) && missWins===0 && hitWins>0;
        myGames.push({ i, need:pk, other:(pk===A?B:A), required,
          info:o.info, matchup:`${A}/${B}` });
      }
    }
    const required = myGames.filter(x=>x.required);
    const helpful  = myGames.filter(x=>!x.required);

    // ---- "GAMES THAT MATTER TO ME": rank this player's undecided games by how much the
    // OUTCOME swings their own win/tie chance (reuses the conditional win-shares from the
    // enumeration — this is a filter/rank, NOT new math). Keeps only the pivotal ~2-3. ----
    const _tbg = (typeof PICKS!=="undefined" && PICKS.tiebreakerGame) ? PICKS.tiebreakerGame : null;
    const tbKey = _tbg ? mkey(_tbg.team1, _tbg.team2) : null;
    const matters = [];
    if(enumerated && !eliminated && !clinched){
      for(let i=0;i<undecided.length;i++){
        const o = undecided[i];
        const A=o.g.team1.toUpperCase(), B=o.g.team2.toUpperCase();
        const pk=(o.g.picks[p]||"").toUpperCase();
        const pickedA = pk===A;
        const hasPick = pk===A || pk===B;
        // conditional win-share of P if side A wins vs side B wins (normalize by branch mass)
        const massA = probMassA[i], massB = 1-massA;
        const shareA = (condA[i][p]||0), shareB = (condB[i][p]||0);
        const pA = massA>1e-9 ? shareA/massA : 0;      // P's win-chance if A wins this game
        const pB = massB>1e-9 ? shareB/massB : 0;      // P's win-chance if B wins this game
        // which side helps P more? (if they have a pick it's their pick; else the better side)
        const rootA = hasPick ? pickedA : (pA>=pB);
        const pRoot = rootA ? pA : pB;                 // P's win-chance if their rooted side wins
        const pAgainst = rootA ? pB : pA;              // if the other side wins
        const swing = Math.abs(pRoot - pAgainst);      // how much this game moves P (0..1)
        const isTb = tbKey && mkey(A,B)===tbKey;
        // early-read proxy (pre-kickoff, when swings are tiny/uniform): pivotalness from being on
        // the minority side of a split + the tiebreaker game. Blends in so the list isn't empty at 0-0.
        let contA=0, contB=0;
        players.forEach(q=>{ const qk=(o.g.picks[q]||"").toUpperCase(); if(qk===A)contA++; else if(qk===B)contB++; });
        const split = contA>0 && contB>0;
        const myShare = pickedA?contA:contB, oppShare = pickedA?contB:contA;
        const minoritySide = hasPick && split && myShare<=oppShare;   // P is on the smaller side
        const earlyScore = (split?0.1:0) + (minoritySide?0.15:0) + (isTb?0.08:0);
        const score = swing + earlyScore*0.001 + (swing<1e-6 ? earlyScore : 0);  // real swing dominates; early proxy only when swing~0
        matters.push({
          i, A, B, need: hasPick ? pk : (rootA?A:B), other: hasPick ? (pickedA?B:A) : (rootA?B:A),
          hasPick, required: required.some(x=>x.i===i), swing, score, isTb, split, minoritySide,
          info:o.info
        });
      }
    }
    // rank by score (biggest mover first); keep only games that actually move P (or early-read proxies)
    matters.sort((x,y)=> y.score - x.score);
    const mattersFiltered = matters.filter(m=> m.swing > 0.02 || m.score > 0.0001);

    return {
      name:p, correct:cur, remaining:rem, maxPossible:mx,
      eliminated, clinched,
      winPct: enumerated ? winShare[p] : null,
      winCnt: WC[p]||0,
      neededAll: required, neededHelpful: helpful, pickedLiveGames: myGames,
      mattersToMe: mattersFiltered,
      tbPred: (tbPreds&&tbPreds[p]!=null)?tbPreds[p]:null
    };
  });

  // rank: clinched first, then by winPct desc (if available) else correct desc, eliminated last
  results.sort((a,b)=>{
    if(a.eliminated!==b.eliminated) return a.eliminated?1:-1;
    if(a.clinched!==b.clinched) return a.clinched?-1:1;
    if(a.winPct!=null && b.winPct!=null && b.winPct!==a.winPct) return b.winPct-a.winPct;
    if(b.correct!==a.correct) return b.correct-a.correct;
    return b.maxPossible-a.maxPossible;
  });

  const alive = new Set(results.filter(r=>!r.eliminated).map(r=>r.name));
  const elimSet = new Set(results.filter(r=>r.eliminated).map(r=>r.name));

  // ---- GAME-FIRST rooting view: for each undecided game, split players by the side they need,
  // and tag intensity (🔥 must-win / ⚠️ big / · minor) from the conditional win-share swing. ----
  // Intensity rule for a rooting player P on game i (their pick = side X):
  //   • MUST-WIN: if X loses, P is eliminated (their conditional win-share on the losing side is 0
  //     AND they still have title equity on the winning side), OR clinch requires it.
  //   • BIG: the game swings P's title chance by a large margin (|share if win − share if lose|).
  //   • minor: small swing.
  // If we didn't enumerate (no games / too many), fall back to split-size only (no intensity %).
  function intensityFor(i, p, pickedA){
    if(!enumerated) return { tag:"minor", swing:null };
    const shareIfWin  = pickedA ? condA[i][p] : condB[i][p];   // credit when P's side won
    const shareIfLose = pickedA ? condB[i][p] : condA[i][p];   // credit when P's side lost
    // normalize to conditional probabilities (divide by the prob mass of each branch)
    const massWin  = pickedA ? probMassA[i] : (1-probMassA[i]);
    const massLose = pickedA ? (1-probMassA[i]) : probMassA[i];
    const pWin  = massWin>1e-9 ? shareIfWin/massWin : 0;
    const pLose = massLose>1e-9 ? shareIfLose/massLose : 0;
    const swing = pWin - pLose;                                 // how much winning this game helps P
    let tag = "minor";
    if(pLose < 0.005 && pWin > 0.02) tag = "must";              // lose this -> essentially no title
    else if(swing >= 0.15) tag = "big";
    return { tag, swing, pWin, pLose };
  }

  const gamesView = undecided.map((o,i)=>{
    const A=o.g.team1.toUpperCase(), B=o.g.team2.toUpperCase();
    const rootA=[], rootB=[];
    players.forEach(p=>{
      const pk=(o.g.picks[p]||"").toUpperCase();
      if(pk!==A && pk!==B) return;                 // player didn't pick this game
      const pickedA = pk===A;
      const eliminated = elimSet.has(p);
      const inten = eliminated ? {tag:"dead",swing:0} : intensityFor(i, p, pickedA);
      (pickedA?rootA:rootB).push({ name:p, tag:inten.tag, swing:inten.swing, eliminated });
    });
    // sort each side: must-win first, then big, then minor; eliminated last
    const order = {must:0, big:1, minor:2, dead:3};
    const bySeverity = (x,y)=> (order[x.tag]-order[y.tag]) || (( y.swing||0)-(x.swing||0));
    rootA.sort(bySeverity); rootB.sort(bySeverity);
    // aliveA/aliveB = contenders (non-eliminated) on each side -> decisiveness of the game
    const aliveA = rootA.filter(r=>!r.eliminated).length, aliveB = rootB.filter(r=>!r.eliminated).length;
    const split = aliveA>0 && aliveB>0;
    const minority = split ? Math.min(aliveA, aliveB) : 0;
    const mustCount = rootA.concat(rootB).filter(r=>r.tag==="must").length;
    const bigCount  = rootA.concat(rootB).filter(r=>r.tag==="big").length;
    // decisiveness score: split contenders matter most, then must-win + big intensity.
    const decisiveness = (split?1000:0) + minority*100 + mustCount*10 + bigCount;
    return { A, B, rootA, rootB, aliveA, aliveB, split, minority, mustCount, bigCount, decisiveness, info:o.info };
  }).sort((x,y)=> y.decisiveness - x.decisiveness);

  // KEY SWING (kept for compatibility): the split games, most-contested first.
  const swing = gamesView.filter(s=>s.split);

  // week state
  let state = "mid";
  if(finals.length===0 && undecided.length>0) state = "notstarted";
  else if(undecided.length===0) state = "final";

  return {
    state, results, gamesView, swing, hasProbSource, enumerated,
    tbResolved: tbActual!=null, tbActual,
    finalsCount: finals.length, totalGames: gamesOut.length
  };
}

// Build the human "needs" line for a player given the computed context.
// SPECIFIC needed-games narrative (the main content). Returns HTML with team chips.
// Formats like: "NEEDS: SEA (beat NE) + KC (beat DEN)" / "Clinches if EITHER of DAL, SEA hits".
function pathNeedsText(r, ctx){
  if(ctx.state==="final"){
    return `${r.correct} correct`;
  }
  if(r.clinched) return `<b class="pn-clinch">CLINCHED</b> — ${r.correct} correct, can't be caught`;
  if(r.eliminated) return `<b class="pn-elim">ELIMINATED</b> — ${r.correct} correct, can't catch the leader even winning out`;

  // needed-game chip: "TEAM (beat OTHER)"
  const chip = x => `<span class="pn-need-g">${teamChip(x.need)} <b>${x.need}</b> <span class="muted">(beat ${x.other})</span></span>`;
  const req = r.neededAll || [];
  const help = r.neededHelpful || [];
  const head = `<b>${r.correct} correct.</b> `;

  // All remaining picked games are required -> must win them all.
  if(req.length && help.length===0){
    if(req.length===1) return head + `NEEDS: ${chip(req[0])} — win it and takes the week.`;
    return head + `NEEDS ALL: ` + req.map(chip).join(" + ") + ` — every one must hit.`;
  }
  // Some required + some helpful.
  if(req.length){
    return head + `MUST HAVE: ` + req.map(chip).join(" + ")
      + (help.length? ` · also helps: ` + help.map(x=>`${x.need}`).join(", ") : "");
  }
  // No single game strictly required, but player still has win paths -> "clinches if any hits" style.
  if(help.length){
    // if winning ANY one of the helpful games clinches (common late), say "either of"
    const names = help.map(x=>x.need);
    if(help.length<=3) return head + `in play — needs help: any of ` + help.map(chip).join(" · ");
    return head + `still alive · ${r.remaining} live picks (needs several to fall right)`;
  }
  // no live picks left but not eliminated (waiting on tiebreaker / others)
  return head + `no live picks left — result rides on other games / tiebreaker`;
}

// Render the PATH TO WIN card — GAME-FIRST "who's rooting for what" view (primary) + a
// per-player path summary (secondary). Recomputes every time render()/tick() runs, so it
// auto-updates on the ESPN score-refresh poll (decided games drop out, tags recompute).
const INTEN = {
  must: { emoji:"🔥", label:"MUST-WIN", cls:"must" },
  big:  { emoji:"⚠️", label:"BIG",      cls:"big"  },
  minor:{ emoji:"·",  label:"minor",    cls:"minor"},
  dead: { emoji:"✖",  label:"out",      cls:"dead" },
};
function rooterChip(r){
  const t = INTEN[r.tag] || INTEN.minor;
  const title = r.tag==="must" ? "Must-win — eliminated if this goes the other way"
    : r.tag==="big" ? "Big swing to their week"
    : r.tag==="dead" ? "Already eliminated" : "Helps, but not critical";
  return `<span class="rooter ${t.cls}" title="${title}">${t.emoji} ${r.name}</span>`;
}

function renderPathToWin(gamesOut){
  const el = document.getElementById("pathtowin"); if(!el) return;
  const players = PICKS.players;
  const tbPreds = PICKS.tiebreaker || {};
  // tbActual: DEN/KC combined total if that game is final
  let tbActual = null;
  const tbg = PICKS.tiebreakerGame;
  if(tbg){
    const tbInfo = gamesOut.find(o=> mkey(o.g.team1,o.g.team2)===mkey(tbg.team1,tbg.team2));
    if(tbInfo && tbInfo.info && tbInfo.info.completed) tbActual = tbInfo.info.total;
  }
  const ctx = computePathToWin(gamesOut, players, tbPreds, tbActual);

  // ===== ALL FINAL: winner + how decided =====
  if(ctx.state==="final"){
    const top = ctx.results[0].correct;
    const tiedTop = ctx.results.filter(r=>r.correct===top);
    const how = tiedTop.length>1 ? `via tiebreaker (closest to ${ctx.tbActual})` : `outright`;
    const banner = `<div class="ptw-banner win">🏆 ${ctx.results[0].name} wins the week — ${how}. (${top} correct)</div>`;
    el.innerHTML = banner + `<div class="ptw-list">` + ctx.results.map((r,i)=>{
      const cls = "ptw-row"+(i===0?" clinched":" elim");
      return `<div class="${cls}"><span class="ptw-rk">${i===0?'🏆':i+1}</span><span>${avatar(r.name)}</span>`
        +`<span class="ptw-mid"><span class="ptw-name">${r.name}</span><span class="ptw-need">${r.correct} correct</span></span></div>`;
    }).join("") + `</div>`;
    return;
  }

  // ===== NOT-STARTED or MID: game-first rooting view =====
  const est = ctx.enumerated && ctx.hasProbSource
    ? `Intensity 🔥/⚠️/· from win-probability swing (betting-line based, rough <b>ESTIMATE</b>).`
    : `Showing rooting split + who's eliminated (no live win-probability source, so no % intensity).`;
  const banner = ctx.state==="notstarted"
    ? `<div class="ptw-banner">🟢 Week not started — all ${ctx.totalGames} games ahead, everyone alive. Here's who's pulling for what. <span class="muted" style="font-weight:400">${est}</span></div>`
    : `<div class="ptw-banner">${ctx.finalsCount} of ${ctx.totalGames} final — decided games drop off; rooting + must-win update live. <span class="muted" style="font-weight:400">${est}</span></div>`;

  // legend
  const legend = `<div class="ptw-legend">🔥 must-win · ⚠️ big swing · · minor · <span class="muted">games sorted most-decisive first</span></div>`;

  // ===== (A) PER-PLAYER PATH — THE MAIN CONTENT: specific needed games/outcomes =====
  const pct = v => (v==null?null:Math.round(v*100));

  // "GAMES THAT MATTER TO ME" mini-list — the pivotal ~2-3 games for this player, ranked by
  // how much their outcome swings this player's week. why-text derived from swing + required.
  function mattersMini(r, early){
    const list = (r.mattersToMe||[]).slice(0, 3);
    if(r.clinched || r.eliminated || !list.length) return "";
    const row = m=>{
      // intensity: 🔥 required(win-or-out) · ⚠️ big swing / pulls into lead · · extends cushion
      let icon="·", why="extends your cushion";
      if(m.required){ icon="🔥"; why="win this or you're out"; }
      else if(m.swing>=0.15){ icon="⚠️"; why="keeps you alive / pulls you toward the lead"; }
      else { icon="·"; why="small edge — extends your cushion"; }
      const swingTxt = (m.swing>0.001 && ctx.hasProbSource) ? ` <span class="mm-sw">±${Math.round(m.swing*100)}%</span>` : "";
      return `<div class="mm-row" title="${why}">
        <span class="mm-ic">${icon}</span>
        <span class="mm-g">${teamChip(m.need)} root <b>${m.need}</b> <span class="muted">(over ${m.other})</span></span>
        <span class="mm-why">${why}${swingTxt}</span>
      </div>`;
    };
    const hd = early
      ? `<div class="mm-h">🎯 Games that matter <span class="muted" style="font-weight:400">— early read</span></div>`
      : `<div class="mm-h">🎯 Games that matter to ${r.name}</div>`;
    return `<div class="mm">${hd}${list.map(row).join("")}</div>`;
  }

  const isEarly = ctx.state==="notstarted";
  const pathList = ctx.results.map((r,i)=>{
    let cls = "ptw-row";
    if(r.clinched) cls+=" clinched"; else if(r.eliminated) cls+=" elim"; else if(i===0) cls+=" lead";
    // shared pool site: no special "you" player — all 6 render identically
    // OPTIONAL tiny % (secondary, clearly labeled estimate) — only when we have a real prob source.
    let like = "";
    if(!r.eliminated && r.winPct!=null && ctx.hasProbSource){
      const p = pct(r.winPct);
      const shown = p<1 && r.winPct>0 ? "<1" : (p>99 && r.winPct<1 ? ">99" : p);
      like = `<span class="ptw-pct" title="Rough estimate only — the needed games above are what matters">~${shown}%<span class="ptw-pct-lbl">est</span></span>`;
    } else if(r.clinched){ like = `<span class="ptw-pct win">✓</span>`; }
    return `<div class="${cls}">
      <span class="ptw-rk">${r.eliminated?'—':(r.clinched?'👑':i+1)}</span>
      <span>${avatar(r.name)}</span>
      <span class="ptw-mid">
        <span class="ptw-name">${r.name}</span>
        <span class="ptw-need">${pathNeedsText(r, ctx)}</span>
        ${mattersMini(r, isEarly)}
      </span>
      ${like}
    </div>`;
  }).join("");

  // GAME CARDS (secondary — the "who's rooting" view)
  const gv = ctx.gamesView || [];
  const gameCards = gv.map(s=>{
    const wp = s.info && s.info.winProb ? s.info.winProb : null;
    const pa = (wp && ctx.hasProbSource) ? Math.round((wp[s.A]!=null?wp[s.A]:0.5)*100) : null;
    const live = s.info && s.info.state==="in";
    const kick = (s.info && s.info.state==="pre") ? fmtCT(s.info.date) : (live?"LIVE":"");
    const decideTag = s.split
      ? `<span class="tag split">DECIDING ${s.aliveA}–${s.aliveB}</span>`
      : `<span class="tag consensus" title="Everyone (or all remaining contenders) picked the same team — won't separate the standings">${(s.aliveA+s.aliveB)>0?'CONSENSUS':'no contenders'}</span>`;
    const sideBlock = (abbr, rooters, prob)=>{
      const chips = rooters.length ? rooters.map(rooterChip).join(" ") : `<span class="muted" style="font-size:12px">nobody</span>`;
      const pTxt = (prob!=null) ? `<span class="rside-p">~${prob}%</span>` : "";
      return `<div class="rside">
        <div class="rside-h">${teamChip(abbr)} <span class="rside-team">${abbr}</span> ${pTxt}</div>
        <div class="rside-rooters">${chips}</div>
      </div>`;
    };
    return `<div class="ptwg ${s.split?'decisive':''}">
      <div class="ptwg-h">
        <span class="ptwg-mu">🏈 ${s.A} <span class="muted" style="font-weight:400">vs</span> ${s.B}</span>
        <span style="display:flex;gap:7px;align-items:center">${kick?`<span class="ptwg-kick">${kick}</span>`:""}${decideTag}</span>
      </div>
      <div class="ptwg-sides">
        ${sideBlock(s.A, s.rootA, pa)}
        <div class="rvs">vs</div>
        ${sideBlock(s.B, s.rootB, pa!=null?100-pa:null)}
      </div>
    </div>`;
  }).join("");

  el.innerHTML = banner
    + `<div class="ptw-sub-h">📋 Each player's path — the exact games they need</div>`
    + `<div class="ptw-list">${pathList}</div>`
    + `<div class="ptw-sub-h" style="margin-top:20px">🏈 Who's rooting for what</div>`
    + legend
    + `<div class="ptwg-list">${gameCards || '<div class="note" style="text-align:left">All games decided.</div>'}</div>`;
}

// Flag which games the group is SPLIT on (differentiators) vs consensus (won't move standings).
function renderDeciding(gamesOut){
  const el = document.getElementById("deciding"); if(!el) return;
  const rows = gamesOut.map(({g,info})=>{
    const counts = {};
    PICKS.players.forEach(p=>{ const pk=(g.picks[p]||"").toUpperCase(); if(pk) counts[pk]=(counts[pk]||0)+1; });
    const picked = Object.values(counts).reduce((a,b)=>a+b,0);
    const distinct = Object.keys(counts).length;
    // disagreement score = how far from unanimous (minority size). 0 = consensus.
    const maxSide = picked ? Math.max(...Object.values(counts)) : 0;
    const minority = picked - maxSide;
    const split = distinct > 1;
    const A=g.team1.toUpperCase(), B=g.team2.toUpperCase();
    const a=counts[A]||0, b=counts[B]||0;
    return {g,info,split,minority,A,B,a,b,picked};
  });
  // show split games first, most-contested first; then consensus
  rows.sort((x,y)=> (y.split-x.split) || (y.minority-x.minority));
  const anyPicks = rows.some(r=>r.picked>0);
  if(!anyPicks){ el.innerHTML = `<div class="note" style="text-align:left">No picks entered yet — split/consensus shows once picks are in.</div>`; return; }
  el.innerHTML = rows.map(r=>{
    const cls = r.split ? "split" : "consensus";
    const win = r.info.winner ? r.info.winner.toUpperCase() : null;
    const tag = r.split ? `<span class="tag split">SPLIT ${r.a}–${r.b}</span>` : `<span class="tag consensus">CONSENSUS</span>`;
    const detail = r.split ? `<span class="split-detail">${r.A} ${r.a} · ${r.B} ${r.b}${win?` · won: ${win}`:""}</span>` : ``;
    return `<div class="dg ${cls}">
      <span class="mu">${teamChip(r.A)} <span class="muted" style="font-weight:400">vs</span> ${teamChip(r.B)}</span>
      <span style="display:flex;align-items:center;gap:8px">${detail}${tag}</span>
    </div>`;
  }).join("");
}

// Render the Week 1..18 tab bar. Weeks with data are clickable; empty weeks are dimmed.
function renderWeekBar(){
  const bar = document.getElementById("weekbar"); if(!bar) return;
  let html = "";
  for(let n=1; n<=TOTAL_WEEKS; n++){
    const has = weekHasData(n);
    const isLive = (n===LIVE_WEEK);
    const cls = ["wk", has?"has":"empty", n===selectedWeek?"active":"", isLive?"live":""].filter(Boolean).join(" ");
    const live = isLive ? `<span class="dotlive" title="current week"></span>` : "";
    const click = has ? ` onclick="selectWeek(${n})"` : "";
    html += `<div class="${cls}"${click} title="${has?('View week '+n):('Week '+n+' — not entered yet')}">${n}${live}</div>`;
  }
  bar.innerHTML = html;
  const lbl = document.getElementById("weeklbl");
  if(lbl){
    lbl.innerHTML = selectedWeek===LIVE_WEEK
      ? `Showing <b>Week ${selectedWeek}</b> (current — live scores)`
      : `Showing <b>Week ${selectedWeek}</b> (final results) · <span class="muted">tap ${LIVE_WEEK} for the live week</span>`;
  }
}

// Switch weeks. Live week -> resume live polling; past week -> render from the archive (no polling).
function selectWeek(n){
  if(!weekHasData(n)) return;
  selectedWeek = n;
  renderWeekBar();
  if(n===LIVE_WEEK){
    if(lastGood) render(lastGood); else render(null);
    tick();                 // resume live fetch/poll for the current week
  } else {
    if(pollTimer) clearTimeout(pollTimer);   // stop polling while viewing a finished week
    renderArchivedWeek(ARCHIVE[n]);
    const rf = document.getElementById("refresh");
    if(rf) rf.innerHTML = `<span class="dot idle"></span>Week ${n} — final results (archived)`;
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

// Render a finished, archived week from season.js (games carry winner + picks; all final).
function renderArchivedWeek(wk){
  if(!wk){ return; }
  const players = PICKS.players;
  // Build a games+info list in the same shape render() uses, but from the archive.
  const gamesOut = (wk.games||[]).map(g=>{
    const A=g.team1.toUpperCase(), B=g.team2.toUpperCase();
    const win = g.winner ? g.winner.toUpperCase() : null;
    const s = g.scores || {};
    return { g:{team1:g.team1, team2:g.team2, picks:g.picks||{}},
             info:{ state:"post", completed:true, winner:win, detail:"",
                    total:(wk.tbActual!=null?wk.tbActual:null),
                    scores:{ [A]:(s[A]!=null?s[A]:null), [B]:(s[B]!=null?s[B]:null) } } };
  });

  // grade
  const wins={}, played={}; players.forEach(p=>{wins[p]=0;played[p]=0;});
  gamesOut.forEach(({g,info})=>{
    players.forEach(p=>{ const pick=(g.picks[p]||"").toUpperCase();
      if(info.winner){ played[p]++; if(pick===info.winner) wins[p]++; } });
  });

  // leaderboard (with tiebreaker if archived)
  const tbActual = (wk.tbActual!=null)?wk.tbActual:null;
  const tbPreds = wk.tiebreaker||{};
  const rows = players.map(p=>({ name:p, wins:wins[p], played:played[p],
    tb:(tbPreds[p]!=null?tbPreds[p]:null),
    tbDiff:(tbActual!=null && tbPreds[p]!=null)?Math.abs(tbPreds[p]-tbActual):null }));
  rows.sort((a,b)=> (b.wins-a.wins) || ((a.tbDiff!=null&&b.tbDiff!=null)?a.tbDiff-b.tbDiff:0));
  const topWins = rows.length?rows[0].wins:0;

  const lb = document.getElementById("leaderboard");
  lb.innerHTML = rows.map((r,i)=>{
    const leading = r.wins===topWins && topWins>0;
    // shared pool site: no special "you" player — every row styled identically (leader gets 👑 only)
    const cls = "lbrow"+(leading?" lead":"");
    const rec = r.played>0 ? `${r.wins}-${r.played-r.wins}` : "—";
    return `<div class="${cls}"><span class="rk">${i+1}</span><span>${avatar(r.name)}</span>`
      +`<span class="nm">${leading?'<span class="crown">👑</span> ':''}${r.name}</span>`
      +`<span class="rec">${rec}</span><span class="w">${r.wins}</span></div>`;
  }).join("");

  const tb = document.getElementById("tiebreak");
  const tbg = `${(wk.games&&wk.games.length)?wk.games[wk.games.length-1].team1:''} + ${(wk.games&&wk.games.length)?wk.games[wk.games.length-1].team2:''}`;
  if(tbActual!=null){
    const best = rows.filter(r=>r.tbDiff!=null).sort((a,b)=>a.tbDiff-b.tbDiff)[0];
    tb.innerHTML = `<b>Tiebreaker</b> total: actual <b>${tbActual}</b>. `
      + players.map(p=>`${p} ${tbPreds[p]!=null?tbPreds[p]:'?'}`).join(" · ")
      + (best?` — closest: <b>${best.name}</b>`:"");
  } else {
    tb.innerHTML = `<b>Tiebreaker</b>: ` + players.map(p=>`${p} ${tbPreds[p]!=null?tbPreds[p]:'?'}`).join(" · ");
  }

  // path to win (headline) + games list reuse the shared renderers
  renderPathToWin(gamesOut);
  renderDeciding(gamesOut);   // no-op unless a #deciding element exists (kept for compatibility)

  const gel = document.getElementById("games");
  gel.innerHTML = gamesOut.map(({g,info})=>{
    const A=g.team1.toUpperCase(), B=g.team2.toUpperCase();
    const win = info.winner?info.winner.toUpperCase():null;
    const teamSpan=(t)=>{ const cls = win ? (t===win?"won":"lost") : ""; return `<span class="${cls}">${teamChip(t, cls)}</span>`; };
    const hasScores = info.scores && (info.scores[A]!=null || info.scores[B]!=null);
    const sc = hasScores ? `<span class="score">${A} ${info.scores[A]!=null?info.scores[A]:'–'} – ${B} ${info.scores[B]!=null?info.scores[B]:'–'}</span>` : "";
    const pks = players.map(p=>{ const pick=(g.picks[p]||"").toUpperCase();
      let c=""; if(win) c=(pick===win)?" correct":" wrong";
      const pk = pick ? teamChip(pick) : '<span class="pick">—</span>';
      return `<span class="pk${c}"><span class="who">${p}:</span> ${pk}</span>`; }).join("");
    return `<div class="game"><div class="ghead">
        <span class="matchup">${teamSpan(A)} <span class="lost">vs</span> ${teamSpan(B)}</span>
        <span class="gstatus s-post">FINAL</span></div>
      ${sc?`<div style="margin-bottom:8px">${sc}</div>`:""}
      <div class="picks">${pks}</div></div>`;
  }).join("");

  document.getElementById("subhead").textContent =
    `Week ${wk.week} · ${PICKS.season} · ${players.length} players · final`;
}

function render(data){
  const gmap = data ? indexGames(data) : {};
  // ---- grade each player ----
  const wins = {}, played = {};
  PICKS.players.forEach(p=>{ wins[p]=0; played[p]=0; });
  const gamesOut = [];

  PICKS.games.forEach(g=>{
    const info = gmap[mkey(g.team1, g.team2)] || {state:"pre", completed:false, winner:null, detail:"", scores:{}};
    PICKS.players.forEach(p=>{
      const pick = (g.picks[p]||"").toUpperCase();
      if(info.completed && info.winner){
        played[p]++;
        if(pick === info.winner.toUpperCase()) wins[p]++;
      }
    });
    gamesOut.push({g, info});
  });

  // ---- polling summary: are any games live / today / all final? (drives adaptive polling) ----
  const allInfos = Object.values(gmap);
  const anyLive = allInfos.some(x=>x.state==="in");
  const anyPre  = allInfos.some(x=>x.state==="pre");
  const gamesToday = allInfos.some(x=>x.date && isTodayCT(x.date));
  const allFinal = allInfos.length>0 && allInfos.every(x=>x.completed);
  pollSummary = { anyLive, gamesToday, allFinal, anyPre };

  // ---- tiebreaker ----
  const tbInfo = gmap[mkey(PICKS.tiebreakerGame.team1, PICKS.tiebreakerGame.team2)];
  const tbActual = (tbInfo && tbInfo.completed) ? tbInfo.total : null;

  // ---- leaderboard: sort by wins desc, then tiebreaker closeness (if game final) ----
  const rows = PICKS.players.map(p=>({
    name:p, wins:wins[p], played:played[p],
    tb:(PICKS.tiebreaker&&PICKS.tiebreaker[p]!=null)?PICKS.tiebreaker[p]:null,
    tbDiff:(tbActual!=null && PICKS.tiebreaker&&PICKS.tiebreaker[p]!=null)?Math.abs(PICKS.tiebreaker[p]-tbActual):null
  }));
  rows.sort((a,b)=>{
    if(b.wins!==a.wins) return b.wins-a.wins;
    if(a.tbDiff!=null && b.tbDiff!=null && a.tbDiff!==b.tbDiff) return a.tbDiff-b.tbDiff;
    return 0;
  });
  const topWins = rows.length?rows[0].wins:0;

  const lb = document.getElementById("leaderboard");
  lb.innerHTML = rows.map((r,i)=>{
    const leading = r.wins===topWins && topWins>0;
    // shared pool site: no special "you" player — every row styled identically (leader gets 👑 only)
    const cls = "lbrow"+(leading?" lead":"");
    const rec = r.played>0 ? `${r.wins}-${r.played-r.wins}` : "—";
    return `<div class="${cls}">
      <span class="rk">${i+1}</span>
      <span>${avatar(r.name)}</span>
      <span class="nm">${leading?'<span class="crown">👑</span> ':''}${r.name}</span>
      <span class="rec">${rec}</span>
      <span class="w">${r.wins}</span>
    </div>`;
  }).join("");

  // tiebreaker line
  const tb = document.getElementById("tiebreak");
  const tbg = `${PICKS.tiebreakerGame.team1} + ${PICKS.tiebreakerGame.team2}`;
  if(tbActual!=null){
    const best = rows.filter(r=>r.tbDiff!=null).sort((a,b)=>a.tbDiff-b.tbDiff)[0];
    tb.innerHTML = `<b>Tiebreaker</b> (${tbg} total): actual <b>${tbActual}</b>. `+
      PICKS.players.map(p=>`${p} ${PICKS.tiebreaker?PICKS.tiebreaker[p]:'?'}`).join(" · ")+
      (best?` — closest: <b>${best.name}</b>`:"");
  } else {
    tb.innerHTML = `<b>Tiebreaker</b> (${tbg} total, resolves when that game ends): `+
      PICKS.players.map(p=>`${p} ${PICKS.tiebreaker?PICKS.tiebreaker[p]:'?'}`).join(" · ");
  }

  // ---- path to win (headline: needs + likelihood + key swing games) ----
  renderPathToWin(gamesOut);
  renderDeciding(gamesOut);   // no-op unless a #deciding element exists (kept for compatibility)

  // ---- games list ----
  const gel = document.getElementById("games");
  gel.innerHTML = gamesOut.map(({g,info})=>{
    const A=g.team1.toUpperCase(), B=g.team2.toUpperCase();
    const win = info.winner?info.winner.toUpperCase():null;
    const teamSpan=(t)=>{
      const cls = win ? (t===win?"won":"lost") : "";
      return `<span class="${cls}">${teamChip(t, cls)}</span>`;
    };
    const stCls = info.state==="post"?"s-post":(info.state==="in"?"s-in":"s-pre");
    const kickCT = fmtCT(info.date);
    const stTxt = info.state==="post"?"FINAL":(info.state==="in"?"LIVE":(kickCT||"—"));
    const sc = (info.scores&&Object.keys(info.scores).length)
      ? `<span class="score">${A} ${info.scores[A]||0} – ${B} ${info.scores[B]||0}</span>` : "";
    const pks = PICKS.players.map(p=>{
      const pick=(g.picks[p]||"").toUpperCase();
      let c="";
      if(win) c = (pick===win)?" correct":" wrong";
      const pk = pick ? teamChip(pick) : '<span class="pick">—</span>';
      return `<span class="pk${c}"><span class="who">${p}:</span> ${pk}</span>`;
    }).join("");
    return `<div class="game">
      <div class="ghead">
        <span class="matchup">${teamSpan(A)} <span class="lost">vs</span> ${teamSpan(B)}</span>
        <span class="gstatus ${stCls}">${stTxt}</span>
      </div>
      ${sc?`<div style="margin-bottom:8px">${sc} <span class="score" style="color:var(--mut)">${info.detail||""}</span></div>`:""}
      <div class="picks">${pks}</div>
    </div>`;
  }).join("");

  document.getElementById("subhead").textContent =
    `Week ${PICKS.week} · ${PICKS.season} · ${PICKS.players.length} players`;
}

function updatedCT(){
  try{ return new Intl.DateTimeFormat("en-US",{ timeZone:"America/Chicago",
      hour:"numeric", minute:"2-digit", second:"2-digit" }).format(new Date()) + " CT"; }
  catch(e){ return new Date().toLocaleTimeString(); }
}
function scheduleNext(){
  if(pollTimer) clearTimeout(pollTimer);
  if(selectedWeek!==LIVE_WEEK) return;   // don't schedule polls while viewing a finished week
  pollTimer = setTimeout(tick, nextPollMs());
}
async function tick(){
  // Only the live week polls ESPN. If viewing an archived week, don't fetch/overwrite it.
  if(selectedWeek!==LIVE_WEEK) return;
  const rf = document.getElementById("refresh");
  const eb = document.getElementById("errbox");
  try{
    const data = await fetchScores();
    lastGood = data; eb.innerHTML="";
    if(selectedWeek!==LIVE_WEEK) return;   // user switched away mid-fetch
    render(data);   // updates pollSummary
    const dotCls = pollSummary.anyLive ? "dot" : "dot idle";
    rf.innerHTML = `<span class="${dotCls}"></span>Updated ${updatedCT()} · ${pollLabel()}`;
  }catch(e){
    if(selectedWeek!==LIVE_WEEK) return;
    // Don't blank the page on a transient failure — keep last good render.
    if(lastGood){ render(lastGood); }
    else { render(null); }   // still show picks + leaderboard (0 wins) even with no scores yet
    eb.innerHTML = `<div class="err">Couldn't reach the live-score feed just now (${e.message}). Showing picks; scores will fill in on the next check.</div>`;
    rf.innerHTML = `retrying…`;
  }finally{
    scheduleNext();   // adaptive: reschedule based on the latest game states
  }
}

// boot
if(typeof PICKS==="undefined"){
  document.getElementById("errbox").innerHTML =
    `<div class="err">picks.js didn't load. Make sure picks.js is in the same folder as index.html.</div>`;
} else {
  renderWeekBar();  // draw the Week 1..18 tabs (current week active, archived weeks clickable)
  render(null);     // instant paint: picks + leaderboard show immediately, before scores arrive
  tick();           // first fetch; tick() reschedules itself adaptively via scheduleNext()
  // If the tab is hidden, the browser throttles timers anyway; when it regains focus, refresh promptly.
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && selectedWeek===LIVE_WEEK) tick(); });
}
</script>
